name: Build

on:
  push:
    branches: [ 'neoforge/**', 'forge/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Builds the jar and runs the JUnit suite (src/test) - compileJava/compileTestJava/test/jar,
      # same as running ./gradlew build locally. First run on a cold cache also downloads and
      # deobfuscates the Forge/Minecraft toolchain via ForgeGradle - slow the first time, cached by
      # actions/setup-java's `cache: gradle` on every run after.
      - name: Build and run unit tests
        run: ./gradlew build --no-daemon

      # Separate step (not bundled into `build`) so a GameTest failure is reported under its own
      # clearly-labeled step instead of buried inside the generic "Build and run unit tests" log.
      - name: Run GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
