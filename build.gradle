plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = neo_version

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    // `mods { sourceSet(sourceSets.gameTest) }` below only wires gameTest onto the mod's *run*
    // classpath; this is the separate, official call that injects Minecraft/NeoForge onto an
    // additional source set's *compile* classpath (by default only `main` gets it).
    addModdingDependenciesTo(sourceSets.gameTest)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    // Runs the `test` task's JUnit tests through the same ModLauncher/FML startup as the game
    // itself, instead of a bare JVM: gives the test source set the Minecraft/NeoForge classpath
    // and bootstraps vanilla's static registries (Blocks, Fluids, ...), which a bare JUnit run
    // can't do (NeoForge patches vanilla's registry bootstrap to require FML's mod loading state).
    unitTest {
        testedMod.set(mods.named(mod_id))
        enable()
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        client {
            client()
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            data()
            programArguments.addAll(
                '--mod', mod_id,
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

repositories {
    // Put repositories for dependencies here

    // Minecraft publishes some platform-specific libraries (including the
    // patched macOS FreeType native) outside Maven Central.
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PonderScene has no public constructor - it's only ever built via Minecraft.getInstance().level,
    // which no automated test environment here provides (see instruction test comments). Mockito
    // lets instruction tests exercise real tick()/firstTick() logic against a mocked PonderScene
    // instead, without ever calling that constructor.
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: minecraft_version, neo_version: neo_version,
                             mod_id           : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors      : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // Licensing has to travel INSIDE the jar, not just sit in the git repo: LGPL-3.0 requires the
    // license text to accompany the work, and the MIT-licensed portions this is derived from (see
    // ATTRIBUTION.md) require their copyright + permission notice in "all copies or substantial
    // portions of the Software". Root-level files are not packaged by default, so without this the
    // built artifact shipped no licensing information at all while the repo looked compliant.
    from(rootProject.files(
        'README.md',                // carries the copyright line and the LGPL notice itself
        'COPYING',                  // GPL-3.0, incorporated by reference into LGPL-3.0
        'COPYING.LESSER',           // LGPL-3.0 - PonderLib's own license
        'THIRD_PARTY_LICENSES.md',  // MIT notice for the Create/Ponder/Catnip portions
        'ATTRIBUTION.md'
    )) {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Lets a consuming mod's build.gradle depend on this jar via JitPack (implementation
// "com.github.Flomik10002:PonderLib:v0.7.0") without hosting a Maven repo of our own - JitPack
// builds the tagged commit and runs publishToMavenLocal itself, so this publication only needs to
// exist, not point anywhere reachable. The buildDir repository is for local testing of that
// publication (./gradlew publish) without needing real repository credentials.
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            from components.java
        }
    }
    repositories {
        maven {
            name = 'buildDir'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
