plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

group = mod_group_id
version = mod_version

base {
    // Distinguishes this branch's jar from the neoforge/1.21.1 branch's identically-versioned
    // ponderlib-0.1.0.jar - both would otherwise produce the exact same filename despite being
    // built for different loaders/Minecraft versions.
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }

        client {
        }

        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }

        gameTestServer {
        }

        data {
            args '--mod', mod_id,
                 '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

repositories {
    // Put repositories for dependencies here
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // compileOnly, not just runtimeOnly: VanillaBootstrapListener implements LauncherSessionListener
    // directly, so its compile classpath needs this too, not just the test JVM's runtime classpath.
    testCompileOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PonderScene has no public constructor - it's only ever built via Minecraft.getInstance().level,
    // which no automated test environment here provides (see instruction test comments). Mockito
    // lets instruction tests exercise real tick()/firstTick() logic against a mocked PonderScene
    // instead, without ever calling that constructor.
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: minecraft_version, forge_version: forge_version,
                             mod_id           : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors      : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // Licensing has to travel INSIDE the jar, not just sit in the git repo: LGPL-3.0 requires the
    // license text to accompany the work, and the MIT-licensed portions this is derived from (see
    // ATTRIBUTION.md) require their copyright + permission notice in "all copies or substantial
    // portions of the Software". Root-level files are not packaged by default, so without this the
    // built artifact shipped no licensing information at all while the repo looked compliant.
    from(rootProject.files(
        'README.md',                // carries the copyright line and the LGPL notice itself
        'COPYING',                  // GPL-3.0, incorporated by reference into LGPL-3.0
        'COPYING.LESSER',           // LGPL-3.0 - PonderLib's own license
        'THIRD_PARTY_LICENSES.md',  // MIT notice for the Create/Ponder/Catnip portions
        'ATTRIBUTION.md'
    )) {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Lets a consuming mod's build.gradle depend on this jar via JitPack (implementation
// "com.github.Flomik10002:PonderLib:v0.6.0-forge-1.20.1") without hosting a Maven repo of our own - JitPack
// builds the tagged commit and runs publishToMavenLocal itself, so this publication only needs to
// exist, not point anywhere reachable. The buildDir repository is for local testing of that
// publication (./gradlew publish) without needing real repository credentials.
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            from components.java

            // The `minecraft` configuration's own dependency (net.minecraftforge:forge) leaks into
            // runtimeElements as "net.minecraftforge:forge:1.20.1-47.4.10_mapped_official_1.20.1" -
            // FG's own internal coordinate for the locally-patched dev jar, not a real artifact
            // published anywhere. A consumer resolving this normally just fails to find it; a
            // consumer using fg.deobf(...) (required for this branch - see the wiki) reads straight
            // into THIS dependency to figure out what to deobfuscate against and chokes on it
            // outright. Consumers already have their own Forge dependency; PonderLib's own is
            // compile-time infrastructure, never something worth publishing as transitive.
            pom.withXml {
                asNode().dependencies.dependency.findAll { it.groupId.text() == 'net.minecraftforge' }
                    .each { it.parent().remove(it) }
            }
        }
    }
    repositories {
        maven {
            name = 'buildDir'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

// Same net.minecraftforge:forge leak as above, but in the Gradle Module Metadata file (which
// Gradle prefers over the POM whenever both are present) - simplest to just not publish that file
// at all, since a plain POM is all a JAR-via-JitPack consumer needs anyway.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
